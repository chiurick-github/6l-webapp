<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6L Apps Script Web App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 透過 iframe 嵌入 GAS Web App (搭配後端 ALLOWALL)，可自動消除頂部「這個應用程式是由 Google Apps Script 的使用者建立」提示橫幅 -->
  <iframe
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbz91sS2WfTSniF2fYntSSMUf2RBvkrJi2K6kkbaSakuweigTCamOfNVX5vQf8RZLWz2/exec?embed=1"
    allow="clipboard-read; clipboard-write"
    title="6L Apps Script Web App">
  </iframe>
</body>
</html>
